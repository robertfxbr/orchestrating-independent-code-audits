[project]
name = "orchestrating-independent-code-audits"
version = "0.1.0"
description = "Deterministic bridge for independent code audit orchestration."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
audit-bridge = "scripts.audit_bridge:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
