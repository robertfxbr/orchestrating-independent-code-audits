[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrating-independent-code-audits"
version = "0.1.0"
description = "Deterministic bridge for independent code audit orchestration."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
audit-bridge = "scripts.audit_bridge:main"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
